<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La carte des comptoirs</title>
<style>
  :root { --bg:#FFFFFF; --ink:#1A1A1A; --muted:#6B6B6B; --line:#C8C8C6; --red:#B5281F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151413; --ink:#ECE9E3; --muted:#A29F99; --line:#4B4946; --red:#E0574A; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:400 17px/1.5 'Segoe UI', system-ui, sans-serif; padding:24px max(16px, env(safe-area-inset-left, 0px)); }
  form { width:min(420px, 100%); display:grid; gap:14px; }
  h1 { margin:0; font:700 2.2rem/1.05 'Bahnschrift', 'Arial Narrow', sans-serif; letter-spacing:-.005em; }
  p { margin:0; color:var(--muted); }
  label { font-weight:600; }
  input { font:inherit; font-size:1.15rem; padding:13px 14px; border:2px solid var(--ink); border-radius:6px; background:var(--bg); color:var(--ink); width:100%; }
  input:focus-visible { outline:3px solid var(--red); outline-offset:2px; }
  button { font:600 1rem/1 inherit; font-family:inherit; padding:14px 18px; border:0; border-radius:6px; background:var(--ink); color:var(--bg); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { min-height:1.5em; color:var(--red); font-weight:600; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>La carte des comptoirs</h1>
  <p>Prototype en accès restreint.</p>
  <label for="mdp">Mot de passe</label>
  <input id="mdp" type="password" autocomplete="current-password" required autofocus>
  <button id="b" type="submit">Entrer</button>
  <p id="msg" role="status" aria-live="polite"></p>
</form>
